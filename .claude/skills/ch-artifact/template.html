<title>$title$</title>
<style>
/* ---- tokens -------------------------------------------------------------
   Neutrals carry a slight blue bias so they read as chosen next to the teal.
   Every component styles through a token; the two theme blocks below only
   redefine tokens, so the viewer's light/dark toggle wins in both directions. */
:root {
  --paper:      #f6f7f9;
  --paper-sunk: #eef0f4;
  --ink:        #161a22;
  --ink-soft:   #414957;
  --ink-mute:   #6b7382;
  --rule:       #dde1e8;
  --rule-soft:  #e8ebf0;
  --accent:     #16706a;
  --accent-ink: #0f524e;

  --measure: 70ch;
  --f-body: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #14171d;
    --paper-sunk: #1b1f27;
    --ink:        #e4e7ec;
    --ink-soft:   #b3bac6;
    --ink-mute:   #899199;
    --rule:       #2b313b;
    --rule-soft:  #232830;
    --accent:     #4fb3a9;
    --accent-ink: #7fcdc4;
  }
}
:root[data-theme="dark"] {
  --paper:      #14171d;
  --paper-sunk: #1b1f27;
  --ink:        #e4e7ec;
  --ink-soft:   #b3bac6;
  --ink-mute:   #899199;
  --rule:       #2b313b;
  --rule-soft:  #232830;
  --accent:     #4fb3a9;
  --accent-ink: #7fcdc4;
}
:root[data-theme="light"] {
  --paper:      #f6f7f9;
  --paper-sunk: #eef0f4;
  --ink:        #161a22;
  --ink-soft:   #414957;
  --ink-mute:   #6b7382;
  --rule:       #dde1e8;
  --rule-soft:  #e8ebf0;
  --accent:     #16706a;
  --accent-ink: #0f524e;
}

/* ---- page ---------------------------------------------------------------- */
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.62;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0 3.5rem;
  max-width: 112rem;
  margin: 0 auto;
  padding: 3rem 1.5rem 6rem;
}
@media (min-width: 62rem) {
  .wrap { grid-template-columns: 15rem minmax(0, 1fr); padding-top: 4rem; }
  .toc  { grid-column: 1; grid-row: 1; }
  main  { grid-column: 2; grid-row: 1; }
}

/* Breakout grid. Prose stays at --measure however wide the window gets, because a
   200-character line is unreadable; tables and code blocks span into the leftover
   width, so widening the window retires their horizontal scrollbars. Both columns
   share a left edge, so the eye keeps one margin and wide content extends rightward.

   Grid items do NOT collapse margins, so every direct child below sets margin-block: 0
   and spacing comes from row-gap plus an explicit margin-top where extra separation is
   wanted. Adding a bottom margin to any direct child will double-space it. */
main {
  min-width: 0;
  display: grid;
  align-content: start;
  row-gap: 1.05rem;
  grid-template-columns:
    [content-start] min(100%, var(--measure)) [content-end]
    minmax(0, 1fr) [wide-end];
}
main > * { grid-column: content-start / content-end; min-width: 0; }
main > .tablewrap, main > pre { grid-column: content-start / wide-end; }

/* ---- contents rail ------------------------------------------------------- */
.toc {
  font-family: var(--f-mono);
  font-size: 0.7rem;
  line-height: 1.5;
  margin-bottom: 3rem;
}
@media (min-width: 62rem) {
  .toc {
    position: sticky; top: 2rem; align-self: start;
    max-height: calc(100vh - 4rem); overflow-y: auto; margin-bottom: 0;
  }
}
.toc::before {
  content: "Contents";
  display: block;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding-bottom: 0.6rem;
  margin-bottom: 0.8rem;
  border-bottom: 1px solid var(--rule);
}
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc ul ul { padding-left: 0.85rem; margin: 0.15rem 0 0.45rem; }
.toc li { margin: 0.28rem 0; }
.toc a { color: var(--ink-soft); text-decoration: none; display: block; }
.toc a:hover { color: var(--accent-ink); }
.toc ul ul a { color: var(--ink-mute); }

/* ---- headings -----------------------------------------------------------
   margin-block: 0 throughout -- see the breakout-grid note above. Section spacing
   is row-gap (1.05rem) plus the margin-top set here. */
h1, h2, h3, h4 { line-height: 1.22; text-wrap: balance; font-weight: 600; margin: 0; }
h1 { font-size: 2.05rem; letter-spacing: -0.015em; }
h2 {
  font-size: 1.32rem;
  letter-spacing: -0.008em;
  margin-top: 2.15rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
}
h3 { font-size: 1.06rem; margin-top: 1.05rem; }
h4 { font-size: 0.95rem; margin-top: 0.45rem; color: var(--ink-soft); }

p { margin: 0; }
strong { font-weight: 640; }

a { color: var(--accent-ink); text-underline-offset: 0.15em; text-decoration-thickness: 0.06em; }
a:focus-visible, .toc a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px;
}

hr { border: 0; border-top: 1px solid var(--rule); margin: 1.55rem 0 0; }

/* ---- lists --------------------------------------------------------------- */
ul, ol { margin: 0; padding-left: 1.35rem; }
li { margin: 0.3rem 0; }
li > ul, li > ol { margin-top: 0.3rem; margin-bottom: 0.4rem; }

/* ---- code ---------------------------------------------------------------- */
code {
  font-family: var(--f-mono);
  font-size: 0.855em;
  background: var(--paper-sunk);
  border: 1px solid var(--rule-soft);
  border-radius: 3px;
  padding: 0.08em 0.32em;
  word-break: break-word;
}
pre {
  background: var(--paper-sunk);
  border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--accent);
  border-radius: 4px;
  padding: 0.9rem 1.1rem;
  overflow-x: auto;
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.55;
}
pre code { background: none; border: 0; padding: 0; font-size: 1em; }

/* ---- tables -------------------------------------------------------------- */
.tablewrap { overflow-x: auto; margin: 0; }
/* No min-width: the table sizes to its content, so a 2-column table stays compact in
   the wide breakout column while a 10-column one takes the room it needs. Wider than
   the column and .tablewrap scrolls -- which widening the window is what fixes. */
table {
  border-collapse: collapse;
  font-size: 0.87rem;
  font-variant-numeric: tabular-nums;
}
th, td {
  text-align: left;
  padding: 0.42rem 0.9rem 0.42rem 0;
  border-bottom: 1px solid var(--rule-soft);
  vertical-align: top;
}
thead th {
  font-family: var(--f-mono);
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-mute);
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}
tbody tr:last-child td { border-bottom: 0; }
/* Identifiers are the main cause of ragged wrapping in these tables, and a wrapped
   identifier is harder to read than a wider table. */
td code, th code { white-space: nowrap; }

/* ---- math ---------------------------------------------------------------- */
math { font-size: 1.02em; }
math[display="block"] {
  display: block;
  margin: 1.3rem 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 0.2rem;
}

/* ---- blockquote ---------------------------------------------------------- */
blockquote {
  margin: 0;
  padding: 0.1rem 0 0.1rem 1.1rem;
  border-left: 2px solid var(--rule);
  color: var(--ink-soft);
}

/* ---- footer -------------------------------------------------------------- */
.stamp {
  margin-top: 2.95rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--f-mono);
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  color: var(--ink-mute);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
$if(toc)$
<nav class="toc">$toc$</nav>
$endif$
<main>
$body$
<p class="stamp">$stamp$</p>
</main>
</div>
